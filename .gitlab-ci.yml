stages:
  - lint
  - e2e_regression

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
    - when: never

lint:
  stage: lint
  image: node:22
  script:
    - npm ci
    - npm run lint
    - npm run typecheck

e2e_regression:
  stage: e2e_regression
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  needs:
    - lint
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      variables:
        CI_ENVIRONMENT_NAME: "QA"
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      variables:
        CI_ENVIRONMENT_NAME: "prod"
    - when: always
      variables:
        CI_ENVIRONMENT_NAME: "dev"
  environment:
    name: $CI_ENVIRONMENT_NAME
  script:
    - npm ci
    - npm run setup
    - npm test
  artifacts:
    when: always
    paths:
      - playwright-report/
    expire_in: 1 week
